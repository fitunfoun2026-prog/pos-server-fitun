<!DOCTYPE html>
<html>
<head>
    <title>Admin - Input Barang Fitun Foun</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #333; color: white; }
    </style>
</head>
<body>
    <h2>🚀 Admin Panel - Input Barang</h2>
    
    <div class="card">
        <h3>Tambah / Update Barang</h3>
        <input type="text" id="barcode" placeholder="Scan Barcode / Kode Barang">
        <input type="text" id="nama" placeholder="Nama Barang">
        <input type="number" id="harga" placeholder="Harga (Contoh: 0.50)" step="0.01">
        <input type="number" id="stok" placeholder="Jumlah Stok">
        <button onclick="simpanBarang()">SIMPAN KE CLOUD</button>
    </div>

    <div class="card">
        <h3>Daftar Stok di Cloud</h3>
        <table id="tabelProduk">
            <thead>
                <tr><th>Barcode</th><th>Nama</th><th>Harga</th><th>Stok</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const BASE_URL = "https://pos-server-fitun.onrender.com";

        async function simpanBarang() {
            const data = {
                barcode: document.getElementById('barcode').value,
                name: document.getElementById('nama').value,
                price: parseFloat(document.getElementById('harga').value),
                stock: parseInt(document.getElementById('stok').value),
                isFullUpdate: true 
            };
            if(!data.name) return alert("Isi nama barang!");

            const res = await fetch(`${BASE_URL}/api/products/update-stock`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if(res.ok) { alert("Berhasil!"); location.reload(); }
        }

        async function loadStok() {
            const res = await fetch(`${BASE_URL}/api/products`);
            const produk = await res.json();
            const body = document.querySelector('#tabelProduk tbody');
            body.innerHTML = "";
            produk.forEach(p => {
                body.innerHTML += `<tr><td>${p.barcode || '-'}</td><td>${p.name}</td><td>$${p.price}</td><td>${p.stock}</td></tr>`;
            });
        }
        loadStok();
    </script>
</body>
</html>
