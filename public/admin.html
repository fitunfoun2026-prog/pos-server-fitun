<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Fitun Mart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --primary: #1f6b2e; --accent: #7dff9a; --bg: #121212; --card: #1e1e1e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; }
        
        /* SIDEBAR */
        .sidebar { width: 250px; background: var(--card); height: 100vh; position: fixed; border-right: 1px solid #333; z-index: 100; }
        .sidebar h2 { color: var(--accent); text-align: center; font-size: 20px; padding: 20px; border-bottom: 1px solid #333; margin: 0; }
        .menu-btn { width: 100%; padding: 15px 20px; border: none; background: none; color: white; text-align: left; cursor: pointer; font-size: 15px; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .menu-btn:hover, .menu-btn.active { background: var(--primary); color: var(--accent); }
        
        /* MAIN CONTENT */
        .main { margin-left: 250px; padding: 30px; width: calc(100% - 250px); box-sizing: border-box; }
        .kamar { display: none; }
        .kamar.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border-bottom: 4px solid var(--accent); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        
        label { display: block; margin-top: 10px; font-size: 12px; color: #aaa; }
        input, select { width: 100%; padding: 12px; margin: 5px 0; background: #252525; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        
        button.utama { background: var(--primary); color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; margin-top: 10px; }
        button.utama:hover { background: #2e7d32; }
        
        .btn-print { background: #0062cc !important; width: auto !important; margin-bottom: 15px; display: inline-block; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #333; padding: 12px; text-align: left; }
        th { background: var(--primary); color: white; }
        tr:nth-child(even) { background: #252525; }

        .badge-stok { padding: 4px 8px; border-radius: 5px; font-weight: bold; }
        .low { background: #4e1a1a; color: #ff8888; }
        .ok { background: #1a4e25; color: #88ff88; }
        .btn-aksi { padding: 5px 10px; cursor: pointer; border: none; border-radius: 4px; margin-right: 5px; }

        /* PRINT STYLE */
        @media print {
            .sidebar, .menu-btn, .utama, .btn-print, .no-print, th:last-child, td:last-child { display: none !important; }
            .main { margin: 0; padding: 0; width: 100%; }
            body { background: white; color: black; }
            .card { border: none; background: white; color: black; box-shadow: none; }
            table { color: black; border: 1px solid black; width: 100%; }
            th, td { border: 1px solid black; padding: 8px; }
            th { background: #ddd !important; color: black; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🚀 FITUN ADMIN</h2>
        <button class="menu-btn active" onclick="bukaKamar('inventaris', this)">📦 Stok Barang</button>
        <button class="menu-btn" onclick="bukaKamar('laporan', this)">📊 Laporan Jualan</button>
        <button class="menu-btn" onclick="bukaKamar('kasir', this)">👥 Akun Kasir</button>
        <button class="menu-btn" onclick="bukaKamar('pengaturan', this)">⚙️ Info Toko</button>
    </div>

    <div class="main">
        <div id="inventaris" class="kamar active">
            <h2>📦 Manajemen Inventaris</h2>
            <div class="card no-print">
                <h3>Tambah / Edit Barang</h3>
                <div class="grid">
                    <div><label>Barcode</label><input type="text" id="barcode" placeholder="Scan Barcode"></div>
                    <div><label>Nama Barang</label><input type="text" id="nama" placeholder="Nama Barang"></div>
                    <div><label>Kategori</label>
                        <select id="kategori">
                            <option value="Makanan">Makanan</option>
                            <option value="Minuman">Minuman</option>
                            <option value="Sabun">Sabun</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div><label>Stok</label><input type="number" id="stok" placeholder="0"></div>
                    <div><label>Modal ($)</label><input type="number" id="h_modal" placeholder="0.00" step="0.01"></div>
                    <div><label>Jual ($)</label><input type="number" id="h_jual" placeholder="0.00" step="0.01"></div>
                </div>
                <button class="utama" id="btnSimpan" onclick="simpanBarang()">💾 SIMPAN DATA KE CLOUD</button>
            </div>

            <div class="card">
                <button class="utama btn-print" onclick="window.print()">🖨️ CETAK DAFTAR STOK</button>
                <table id="tabelStok">
                    <thead>
                        <tr><th>Barcode</th><th>Nama</th><th>Modal</th><th>Jual</th><th>Stok</th><th class="no-print">Aksi</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="laporan" class="kamar">
            <h2>📊 Laporan Jualan Toko</h2>
            <div class="card">
                <button class="utama btn-print" onclick="window.print()">🖨️ PRINT LAPORAN JUALAN</button>
                <table id="tabelLaporan">
                    <thead>
                        <tr><th>Waktu</th><th>Kasir</th><th>Item</th><th>Total</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="kasir" class="kamar">
            <h2>👥 Akun Kasir</h2>
            <div class="card">
                <div class="grid">
                    <input type="text" id="u_kasir" placeholder="Username Kasir">
                    <input type="password" id="p_kasir" placeholder="Password Baru">
                </div>
                <button class="utama" onclick="alert('Berhasil Update!')">➕ SIMPAN AKUN</button>
            </div>
        </div>

        <div id="pengaturan" class="kamar">
            <h2>⚙️ Info Toko</h2>
            <div class="card">
                <label>Nama Toko</label><input type="text" id="t_nama" value="FITUN MART">
                <label>Alamat Toko</label><input type="text" id="t_alamat" value="Jl. Raya Utama">
                <button class="utama">✅ UPDATE STRUK</button>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = "https://pos-server-fitun.onrender.com";

        function bukaKamar(id, btn) {
            document.querySelectorAll('.kamar').forEach(k => k.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            loadData();
        }

        async function simpanBarang() {
            const data = {
                barcode: document.getElementById('barcode').value,
                name: document.getElementById('nama').value,
                category: document.getElementById('kategori').value,
                qty: parseInt(document.getElementById('stok').value) || 0,
                costPrice: parseFloat(document.getElementById('h_modal').value) || 0,
                price: parseFloat(document.getElementById('h_jual').value) || 0,
                isFullUpdate: true
            };

            if(!data.barcode || !data.name) {
                alert("Barcode dan Nama tidak boleh kosong!");
                return;
            }

            try {
                const res = await fetch(`${BASE_URL}/api/products/update-stock`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                if(res.ok) {
                    alert("Berhasil disimpan!");
                    bersihForm();
                    loadData();
                }
            } catch (e) { console.error(e); }
        }

        async function loadData() {
            try {
                const resP = await fetch(`${BASE_URL}/api/products`);
                const produk = await resP.json();
                const bStok = document.querySelector("#tabelStok tbody");
                bStok.innerHTML = "";
                
                produk.forEach(p => {
                    const status = p.stock < 10 ? 'low' : 'ok';
                    // Kita gunakan JSON.stringify untuk menangani teks agar aman di fungsi isiEdit
                    const pData = JSON.stringify(p).replace(/"/g, '&quot;');
                    
                    bStok.innerHTML += `<tr>
                        <td>${p.barcode || '-'}</td>
                        <td><b>${p.name}</b><br><small>${p.category || 'Umum'}</small></td>
                        <td>$${(p.costPrice || 0).toFixed(2)}</td>
                        <td>$${(p.price || 0).toFixed(2)}</td>
                        <td><span class="badge-stok ${status}">${p.stock}</span></td>
                        <td class="no-print">
                            <button class="btn-aksi" style="background:#ffc107" onclick="isiEdit('${p.barcode}', '${p.name}', ${p.price}, ${p.stock}, ${p.costPrice || 0}, '${p.category || 'Umum'}')">📝</button>
                            <button class="btn-aksi" style="background:#dc3545; color:white" onclick="hapus('${p.barcode}')">🗑️</button>
                        </td>
                    </tr>`;
                });

                const resT = await fetch(`${BASE_URL}/api/transactions`);
                const transaksi = await resT.json();
                const bLap = document.querySelector("#tabelLaporan tbody");
                bLap.innerHTML = "";
                transaksi.reverse().forEach(t => {
                    bLap.innerHTML += `<tr>
                        <td>${new Date(t.waktu).toLocaleString()}</td>
                        <td>${t.kasir}</td>
                        <td>${t.items.map(i => i.nama).join(", ")}</td>
                        <td>$${t.total.toFixed(2)}</td>
                    </tr>`;
                });
            } catch (err) { console.log("Gagal memuat data"); }
        }

        function isiEdit(bc, nm, pr, st, cp, kt) {
            document.getElementById('barcode').value = bc;
            document.getElementById('nama').value = nm;
            document.getElementById('h_jual').value = pr;
            document.getElementById('stok').value = st;
            document.getElementById('h_modal').value = cp;
            document.getElementById('kategori').value = kt;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        async function hapus(bc) {
            if(!confirm("Hapus barang ini?")) return;
            await fetch(`${BASE_URL}/api/products/${bc}`, { method: 'DELETE' });
            loadData();
        }

        function bersihForm() {
            document.querySelectorAll('input').forEach(i => i.value = "");
        }

        loadData();
    </script>
</body>
</html>
