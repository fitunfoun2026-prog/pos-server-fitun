<!DOCTYPE html>
<html>
<head>
    <title>Admin - Input Barang Fitun Foun</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #121212; color: white; text-align: center; }
        .container { max-width: 900px; margin: auto; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 20px; border-bottom: 4px solid #7dff9a; text-align: left; }
        h2 { color: #7dff9a; text-transform: uppercase; letter-spacing: 2px; }
        input { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; background: #252525; border: 1px solid #333; color: white; border-radius: 8px; }
        button { width: 100%; padding: 15px; background: #1f6b2e; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2e7d32; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e1e; }
        th, td { border: 1px solid #333; padding: 12px; text-align: left; }
        th { background: #1f6b2e; }
        .text-hijau { color: #7dff9a; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚀 Admin Panel - Fitun Foun</h2>
        <div class="card">
            <h3>Tambah / Update Barang ke MongoDB</h3>
            <input type="text" id="barcode" placeholder="Scan Barcode / Kode Barang">
            <input type="text" id="nama" placeholder="Nama Barang">
            <input type="number" id="harga" placeholder="Harga Satuan (USD)" step="0.01">
            <input type="number" id="stok" placeholder="Jumlah Stok">
            <button onclick="simpanBarang()">💾 SIMPAN KE DATABASE PUSAT</button>
        </div>
        <div class="card">
            <h3>Daftar Stok Saat Ini (Cloud)</h3>
            <table id="tabelProduk">
                <thead>
                    <tr><th>Barcode</th><th>Nama</th><th>Harga</th><th>Stok</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const BASE_URL = "https://pos-server-fitun.onrender.com";

        async function simpanBarang() {
            const btn = document.querySelector("button");
            const data = {
                barcode: document.getElementById('barcode').value,
                name: document.getElementById('nama').value,
                price: parseFloat(document.getElementById('harga').value),
                qty: parseInt(document.getElementById('stok').value),
                isFullUpdate: true 
            };

            if(!data.name || isNaN(data.price) || isNaN(data.qty)) return alert("Isi semua data!");

            btn.disabled = true; btn.innerText = "⏳ MENYIMPAN...";

            try {
                const res = await fetch(`${BASE_URL}/api/products/update-stock`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if(res.ok) { alert("Berhasil simpan ke MongoDB!"); location.reload(); }
            } catch (e) { alert("Error koneksi!"); }
            finally { btn.disabled = false; btn.innerText = "💾 SIMPAN KE DATABASE PUSAT"; }
        }

        async function loadStok() {
            try {
                const res = await fetch(`${BASE_URL}/api/products`);
                const produk = await res.json();
                const body = document.querySelector('#tabelProduk tbody');
                body.innerHTML = produk.map(p => `
                    <tr>
                        <td>${p.barcode || '-'}</td>
                        <td class="text-hijau">${p.name}</td>
                        <td>$${p.price.toFixed(2)}</td>
                        <td style="color:${p.stock < 10 ? '#ff5555' : '#7dff9a'}">${p.stock}</td>
                    </tr>`).join('');
            } catch (e) { console.error("Gagal load data"); }
        }
        loadStok();
    </script>
</body>
</html>
