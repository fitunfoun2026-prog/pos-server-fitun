<script>
const API = "https://pos-server-fitun.onrender.com/api";

function formatRupiah(num){
    return "$" + Number(num || 0).toFixed(2);
}

function tab(id, el) {
    document.querySelectorAll('.kamar').forEach(k => k.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
    muatData();
}

async function muatData() {
    try {
        const [pRes, tRes] = await Promise.all([
            fetch(`${API}/products`),
            fetch(`${API}/transactions`)
        ]);

        const products = await pRes.json();
        const transactions = await tRes.json();

        const tbody = document.querySelector("#t-prod tbody");
        tbody.innerHTML = "";

        products.forEach(p => {
            const low = p.stock < (p.minStock || 10);
            tbody.innerHTML += `
                <tr style="${low ? 'background:#fee2e2' : ''}">
                    <td>${p.barcode}</td>
                    <td>${p.name}</td>
                    <td>${p.category}</td>
                    <td>${formatRupiah(p.costPrice)}</td>
                    <td>${formatRupiah(p.price)}</td>
                    <td>${p.supplier || '-'}</td>
                    <td>${p.stock}</td>
                </tr>
            `;
        });

        let omzet = 0;
        let labaTotal = 0;
        const bFin = document.querySelector("#t-fin tbody");
        bFin.innerHTML = "";

        transactions.forEach(t => {
            let laba = 0;
            omzet += t.total || 0;

            t.items.forEach(i => {
                const ref = products.find(p => p.barcode === i.barcode);
                if (ref) {
                    laba += (i.harga - ref.costPrice) * i.qty;
                }
            });

            labaTotal += laba;

            bFin.innerHTML += `
                <tr>
                    <td>${new Date(t.waktu).toLocaleDateString()}</td>
                    <td>Penjualan</td>
                    <td>${formatRupiah(t.total)}</td>
                    <td>${formatRupiah(laba)}</td>
                </tr>
            `;
        });

        document.getElementById('d-omzet').innerText = formatRupiah(omzet);
        document.getElementById('d-laba').innerText = formatRupiah(labaTotal);
        document.getElementById('d-prod').innerText = products.length;

    } catch(e){
        console.error(e);
    }
}

async function simpan() {
    const data = {
        barcode: bc.value.trim(),
        name: nm.value.trim(),
        category: cat.value,
        costPrice: Number(hm.value),
        price: Number(hj.value),
        supplier: sup.value.trim(),
        qty: 0,
        minStock: 10,
        isFullUpdate: true
    };

    if(!data.barcode || !data.name){
        alert("Barcode & Nama wajib diisi");
        return;
    }

    await fetch(`${API}/products/update-stock`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(data)
    });

    alert("Data berhasil disimpan");
    muatData();
}

muatData();
</script>
