<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>FITUN HQ - Administrator System</title>
    <style>
        :root { --primary: #2e7d32; --secondary: #1b5e20; --accent: #7dff9a; --bg: #121212; --card: #1e1e1e; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; }
        
        .sidebar { width: 260px; background: var(--card); height: 100vh; position: fixed; border-right: 1px solid #333; }
        .sidebar h2 { color: var(--accent); text-align: center; padding: 20px; margin: 0; border-bottom: 1px solid #333; }
        .menu-group { padding: 15px 10px 5px; font-size: 11px; color: #666; font-weight: bold; text-transform: uppercase; }
        .menu-btn { width: 100%; padding: 12px 20px; border: none; background: none; color: #ccc; text-align: left; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .menu-btn:hover, .menu-btn.active { background: var(--primary); color: white; border-radius: 4px; }

        .main { margin-left: 260px; padding: 30px; width: 100%; }
        .card { background: var(--card); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        
        input, select { width: 100%; padding: 10px; background: #252525; border: 1px solid #444; color: white; border-radius: 5px; margin-top: 5px; }
        button.save { background: var(--primary); color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 15px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #252525; color: var(--accent); padding: 12px; text-align: left; font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid #333; font-size: 14px; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .bg-low { background: #ff5252; color: white; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>FITUN MART</h2>
        <div class="menu-group">Master Data</div>
        <button class="menu-btn active" onclick="showTab('produk')">📦 Katalog Produk</button>
        <button class="menu-btn" onclick="showTab('promo')">🏷️ Management Promo</button>
        
        <div class="menu-group">Keuangan</div>
        <button class="menu-btn" onclick="showTab('laporan')">📊 Laporan Penjualan</button>
        <button class="menu-btn" onclick="showTab('laba')">💸 Analisis Laba/HPP</button>
        
        <div class="menu-group">System</div>
        <button class="menu-btn" onclick="showTab('kasir')">👥 User & Kasir</button>
    </div>

    <div class="main">
        <div id="produk" class="tab-content">
            <div class="card">
                <h3>Input Master Barang Baru</h3>
                <div class="grid">
                    <div><label>Barcode</label><input type="text" id="bc"></div>
                    <div><label>Nama Barang</label><input type="text" id="nm"></div>
                    <div><label>Kategori</label>
                        <select id="kt">
                            <option>Makanan</option><option>Minuman</option><option>Kebutuhan Rumah</option>
                        </select>
                    </div>
                    <div><label>Harga Modal</label><input type="number" id="hm"></div>
                    <div><label>Harga Jual</label><input type="number" id="hj"></div>
                    <div><label>Stok Awal</label><input type="number" id="st"></div>
                </div>
                <button class="save" onclick="saveMaster()">💾 SIMPAN DATA MASTER</button>
            </div>

            <div class="card">
                <h3>Daftar Inventaris Pusat</h3>
                <table id="tableMaster">
                    <thead>
                        <tr><th>Barcode</th><th>Nama</th><th>Kategori</th><th>Modal</th><th>Jual</th><th>Stok</th><th>Aksi</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API = "https://pos-server-fitun.onrender.com/api/products";

        async function loadData() {
            const res = await fetch(API);
            const data = await res.json();
            const tbody = document.querySelector("#tableMaster tbody");
            tbody.innerHTML = data.map(p => `
                <tr>
                    <td>${p.barcode}</td>
                    <td><b>${p.name}</b></td>
                    <td>${p.category}</td>
                    <td>Rp ${p.costPrice.toLocaleString()}</td>
                    <td>Rp ${p.price.toLocaleString()}</td>
                    <td><span class="badge ${p.stock < 10 ? 'bg-low' : ''}">${p.stock}</span></td>
                    <td><button onclick="deleteProduct('${p.barcode}')">🗑️</button></td>
                </tr>
            `).join('');
        }

        async function saveMaster() {
            const body = {
                barcode: document.getElementById('bc').value,
                name: document.getElementById('nm').value,
                category: document.getElementById('kt').value,
                costPrice: document.getElementById('hm').value,
                price: document.getElementById('hj').value,
                stock: document.getElementById('st').value
            };
            await fetch(`${API}/master-update`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            alert("Data Berhasil Disimpan");
            loadData();
        }

        function showTab(id) {
            // Logika pindah tab bisa ditambahkan di sini
            console.log("Pindah ke tab: " + id);
        }

        loadData();
    </script>
</body>
</html>
