<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Executive Monitoring - Supervisor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; padding: 40px; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }
        .card { background: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #334155; }
        .card small { color: #94a3b8; text-transform: uppercase; font-size: 12px; }
        .card h1 { font-size: 42px; margin: 15px 0; color: #38bdf8; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; background: #1e293b; }
        th { text-align: left; background: #334155; padding: 15px; font-size: 12px; color: #94a3b8; }
        td { padding: 15px; border-bottom: 1px solid #334155; }
        .low { color: #f87171; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <div><h1>Executive Monitor</h1><p>Pantauan Real-time Performa Supermarket</p></div>
        <button onclick="location.reload()" style="padding:10px 20px; cursor:pointer; border-radius:8px;">Refresh Data</button>
    </div>

    <div class="grid">
        <div class="card"><small>Omzet Hari Ini</small><h1 id="omzet">$0.00</h1></div>
        <div class="card"><small>Net Profit</small><h1 id="profit" style="color:#10b981">$0.00</h1></div>
        <div class="card"><small>Barang Stok Kritis</small><h1 id="kritis" style="color:#f87171">0</h1></div>
    </div>

    <h3>Daftar Re-Order Barang (Stok < 10)</h3>
    <table id="table-alert">
        <thead><tr><th>Nama Barang</th><th>Kategori</th><th>Stok Sisa</th><th>Status</th></tr></thead>
        <tbody></tbody>
    </table>

    <script>
        async function load() {
            const [pRes, tRes] = await Promise.all([
                fetch("https://pos-server-fitun.onrender.com/api/products"),
                fetch("https://pos-server-fitun.onrender.com/api/transactions")
            ]);
            const products = await pRes.json();
            const transactions = await tRes.json();

            let omzet = 0, profit = 0, kritis = 0;
            const tAlert = document.querySelector("#table-alert tbody");

            transactions.forEach(t => {
                omzet += t.total;
                t.items.forEach(i => {
                    const p = products.find(prod => prod.name === i.nama);
                    if(p) profit += (i.harga - p.costPrice) * i.qty;
                });
            });

            products.forEach(p => {
                if(p.stock < 10) {
                    kritis++;
                    tAlert.innerHTML += `<tr class="low"><td>${p.name}</td><td>${p.category}</td><td>${p.stock}</td><td>🚨 KRITIS</td></tr>`;
                }
            });

            document.getElementById('omzet').innerText = "$" + omzet.toFixed(2);
            document.getElementById('profit').innerText = "$" + profit.toFixed(2);
            document.getElementById('kritis').innerText = kritis;
        }
        load();
    </script>
</body>
</html>
