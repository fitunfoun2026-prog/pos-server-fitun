<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Supervisor Dashboard - Fitun Mart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --primary: #1f6b2e; --accent: #7dff9a; --bg: #121212; --card: #1e1e1e; --profit-color: #00e5ff; --alert-color: #ff5555; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; padding: 20px; margin: 0; }
        .container { max-width: 1100px; margin: auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        
        /* KOTAK STATISTIK */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card-stat { background: var(--card); padding: 25px; border-radius: 15px; text-align: center; border-bottom: 5px solid var(--accent); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .card-stat p { font-size: 14px; color: #aaa; margin: 0; text-transform: uppercase; }
        .card-stat h2 { font-size: 42px; margin: 10px 0; font-weight: bold; }
        
        .val-omzet { color: var(--accent); }
        .val-profit { color: var(--profit-color); }
        .val-alert { color: var(--alert-color); }

        /* TABEL LAYOUT */
        .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .card-table { background: var(--card); padding: 20px; border-radius: 12px; }
        h3 { margin-top: 0; color: var(--accent); border-left: 4px solid var(--accent); padding-left: 10px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #333; padding: 12px; text-align: left; }
        th { background: #252525; color: #7dff9a; }
        tr:nth-child(even) { background: #1a1a1a; }

        .btn-refresh { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-refresh:hover { background: #2e7d32; }
        
        .low-stock-row { background: #3a1c1c !important; color: #ff8888; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 Supervisor Control Center</h1>
        <button class="btn-refresh" onclick="loadData()">🔄 REFRESH DATA</button>
    </div>

    <div class="stats-grid">
        <div class="card-stat">
            <p>Total Omzet (Penjualan)</p>
            <h2 id="totalOmzet" class="val-omzet">$0.00</h2>
        </div>
        <div class="card-stat">
            <p>Estimasi Laba Bersih (Profit)</p>
            <h2 id="totalProfit" class="val-profit">$0.00</h2>
        </div>
        <div class="card-stat">
            <p>Barang Harus Re-Stock</p>
            <h2 id="alertStok" class="val-alert">0 Item</h2>
        </div>
    </div>

    <div class="content-grid">
        <div class="card-table">
            <h3>📜 Riwayat Transaksi Terbaru</h3>
            <table id="tabelTrans">
                <thead>
                    <tr><th>Waktu</th><th>Kasir</th><th>Total</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="card-table">
            <h3>🚨 Alert Stok Menipis</h3>
            <table id="tabelKritis">
                <thead>
                    <tr><th>Nama Barang</th><th>Sisa</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const BASE_URL = "https://pos-server-fitun.onrender.com";

    async function loadData() {
        try {
            // 1. Ambil Data Produk (Untuk Stok & Referensi Harga Modal)
            const resP = await fetch(`${BASE_URL}/api/products`);
            const products = await resP.json();
            
            // 2. Ambil Data Transaksi
            const resT = await fetch(`${BASE_URL}/api/transactions`);
            const transactions = await resT.json();

            let totalOmzet = 0;
            let totalProfit = 0;
            let stokKritis = 0;

            // HITUNG OMZET & PROFIT
            transactions.forEach(t => {
                totalOmzet += Number(t.total);
                
                // Cari profit per item dalam transaksi
                t.items.forEach(item => {
                    const prodAsli = products.find(p => p.name === item.nama || p.barcode === item.barcode);
                    if(prodAsli && prodAsli.costPrice) {
                        // Profit = (Harga Jual - Harga Modal) * Jumlah Terjual
                        totalProfit += (Number(item.harga) - Number(prodAsli.costPrice)) * Number(item.qty || 1);
                    }
                });
            });

            // TAMPILKAN TRANSAKSI (10 Terakhir)
            const bTrans = document.querySelector("#tabelTrans tbody");
            bTrans.innerHTML = "";
            transactions.reverse().slice(0, 10).forEach(t => {
                bTrans.innerHTML += `
                    <tr>
                        <td>${new Date(t.waktu).toLocaleTimeString()}</td>
                        <td>${t.kasir}</td>
                        <td>$${Number(t.total).toFixed(2)}</td>
                    </tr>`;
            });

            // TAMPILKAN STOK KRITIS (< 10)
            const bKritis = document.querySelector("#tabelKritis tbody");
            bKritis.innerHTML = "";
            products.forEach(p => {
                if(p.stock < 10) {
                    stokKritis++;
                    bKritis.innerHTML += `
                        <tr class="low-stock-row">
                            <td>${p.name}</td>
                            <td><b>${p.stock}</b></td>
                        </tr>`;
                }
            });

            // UPDATE ANGKA DASHBOARD
            document.getElementById('totalOmzet').innerText = "$" + totalOmzet.toFixed(2);
            document.getElementById('totalProfit').innerText = "$" + totalProfit.toFixed(2);
            document.getElementById('alertStok').innerText = stokKritis + " Item";

        } catch (e) {
            console.error("Gagal Sinkronisasi Data: ", e);
        }
    }

    // Load pertama kali
    loadData();
    // Auto refresh setiap 1 menit
    setInterval(loadData, 60000);
</script>
</body>
</html>
