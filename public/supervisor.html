<script>
const API = "https://pos-server-fitun.onrender.com/api";

function tab(id, el) {
    document.querySelectorAll('.kamar').forEach(k => k.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
    loadData();
}

async function loadData() {
    try {
        const [pRes, tRes] = await Promise.all([
            fetch(`${API}/products`),
            fetch(`${API}/transactions`)
        ]);

        const products = await pRes.json();
        const transactions = await tRes.json();

        let crit = 0;
        const bOpname = document.querySelector("#t-opname tbody");
        bOpname.innerHTML = "";

        products.forEach(p => {
            const low = p.stock < (p.minStock || 10);
            if(low) crit++;

            bOpname.innerHTML += `
                <tr style="${low ? 'background:#fee2e2' : ''}">
                    <td>${p.name}</td>
                    <td>${p.stock}</td>
                    <td><input type='number' id='inp-${p.barcode}' style='width:70px'></td>
                    <td><button onclick="simpanFisik('${p.barcode}')">Save</button></td>
                </tr>
            `;
        });

        document.getElementById('s-crit').innerText = crit;

        const bTrx = document.querySelector("#t-trx tbody");
        bTrx.innerHTML = "";

        transactions
            .sort((a,b)=> new Date(b.waktu)-new Date(a.waktu))
            .slice(0,5)
            .forEach(t => {
                bTrx.innerHTML += `
                    <tr>
                        <td>${new Date(t.waktu).toLocaleTimeString()}</td>
                        <td>${t.kasir || 'Kasir'}</td>
                        <td>$${t.total}</td>
                    </tr>
                `;
            });

    } catch(e){
        console.error(e);
    }
}

async function simpanFisik(barcode) {
    const qty = document.getElementById(`inp-${barcode}`).value;

    if(!qty){
        alert("Masukkan jumlah fisik");
        return;
    }

    await fetch(`${API}/products/update-stock`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
            barcode,
            qty: Number(qty),
            isFullUpdate: true
        })
    });

    alert("Stok diperbarui");
    loadData();
}

async function laporkanRusak() {
    const bc = w_bc.value;
    const qty = w_qty.value;

    if(!bc || !qty){
        alert("Data belum lengkap");
        return;
    }

    await fetch(`${API}/products/wastage`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ barcode: bc, qty: Number(qty) })
    });

    alert("Wastage berhasil dilaporkan");
    loadData();
}

loadData();
</script>
