<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Supervisor - Realtime Monitor</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 40px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; }
        .card h1 { font-size: 40px; color: #38bdf8; margin: 10px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #334155; }
        .alert { color: #f87171; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Executive Monitor</h1>
    <div class="grid">
        <div class="card"><small>OMZET</small><h1 id="r-omzet">$0</h1></div>
        <div class="card"><small>PROFIT</small><h1 id="r-profit" style="color:#4ad395">$0</h1></div>
        <div class="card"><small>STOK TIPIS</small><h1 id="r-crit" style="color:#f87171">0</h1></div>
    </div>
    <h3>Peringatan Stok Low (<10)</h3>
    <table id="t-alert">
        <thead><tr><th>Barang</th><th>Kategori</th><th>Sisa</th></tr></thead>
        <tbody></tbody>
    </table>

    <script>
        async function load() {
            const [pRes, tRes] = await Promise.all([fetch("https://pos-server-fitun.onrender.com/api/products"), fetch("https://pos-server-fitun.onrender.com/api/transactions")]);
            const products = await pRes.json();
            const transactions = await tRes.json();

            let omzet = 0, profit = 0, crit = 0;
            const alertBody = document.querySelector("#t-alert tbody");
            alertBody.innerHTML = "";

            transactions.forEach(t => {
                omzet += t.total;
                t.items.forEach(i => {
                    const p = products.find(prod => prod.name === i.nama);
                    if(p) profit += (i.harga - p.costPrice) * i.qty;
                });
            });

            products.forEach(p => {
                if(p.stock < 10) {
                    crit++;
                    alertBody.innerHTML += `<tr class="alert"><td>${p.name}</td><td>${p.category}</td><td>${p.stock}</td></tr>`;
                }
            });

            document.getElementById('r-omzet').innerText = "$" + omzet;
            document.getElementById('r-profit').innerText = "$" + profit;
            document.getElementById('r-crit').innerText = crit;
        }
        load();
        setInterval(load, 30000);
    </script>
</body>
</html>
